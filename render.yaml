services:
  - type: web
    name: forma-staging-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/categories
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: MERCADOPAGO_ENVIRONMENT
        value: test
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_ADMIN_EMAIL
        value: admin@forma.test
      - key: APP_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        value: forma_runtime
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_MIGRATION_USERNAME
        sync: false
      - key: DATABASE_MIGRATION_PASSWORD
        sync: false
      - key: APP_FRONTEND_ORIGIN
        sync: false
      - key: APP_PUBLIC_FRONTEND_URL
        sync: false
      - key: APP_PUBLIC_BACKEND_URL
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_COLLECTOR_ID
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
