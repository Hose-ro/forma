spring:
  application:
    name: olvenio-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/olvenio}
    username: ${DATABASE_USERNAME:olvenio}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The role the application connects with; migrations grant it the tables they create.
    placeholders:
      runtimeRole: ${DATABASE_USERNAME:olvenio}
  mvc:
    formcontent:
      filter:
        enabled: false
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 128KB
    max-http-form-post-size: 128KB
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: OLVENIO_SESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
        path: /

springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:false}
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'

app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:3000}
  session-secret: ${APP_SESSION_SECRET:}
  cookie-secure: ${APP_COOKIE_SECURE:true}
  currency: MXN
  checkout:
    quote-ttl: 30m
    # Unpaid orders keep their stock this long; the Mercado Pago preference expires at the same instant.
    reservation-ttl: ${APP_RESERVATION_TTL:24h}
    shipping-zones: ${APP_SHIPPING_ZONES:}
    shipping-only-zones: ${APP_SHIPPING_ONLY_ZONES:false}
    delivery-estimate: ${APP_SHIPPING_DELIVERY_ESTIMATE:3 a 7 días hábiles}
  after-sales:
    preparation-alert-hours: ${APP_PREPARATION_ALERT_HOURS:24}
    return-days: ${APP_RETURN_DAYS:30}
  envia:
    token: ${APP_ENVIA_TOKEN:}
    origin: ${APP_ENVIA_ORIGIN_JSON:}
    carriers: ${APP_ENVIA_CARRIERS:estafeta}
    environment: ${APP_ENVIA_ENVIRONMENT:sandbox}
  store-name: ${APP_STORE_NAME:Olvenio}
  security:
    # Shared with the storefront (BACKEND_PROXY_SECRET). Lets rate limits see each visitor instead of the proxy.
    proxy-secret: ${APP_PROXY_SECRET:}
  mail:
    # Emails are sent only when SPRING_MAIL_HOST (+ port/username/password) is set.
    from: ${APP_MAIL_FROM:}
    notify: ${APP_ORDERS_NOTIFY_EMAIL:}
    poll-delay: ${APP_MAIL_POLL_DELAY:60000}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

  payments:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    environment: ${MERCADOPAGO_ENVIRONMENT:test}
    collector-id: ${MERCADOPAGO_COLLECTOR_ID:}
    frontend-url: ${APP_PUBLIC_FRONTEND_URL:}
    backend-url: ${APP_PUBLIC_BACKEND_URL:}
    # Optional. Enabled when a secret key is set; test mode needs sk_test_/rk_test_, production sk_live_/rk_live_.
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      environment: ${STRIPE_ENVIRONMENT:test}
    # Optional. Enabled when client id and secret are set; test = sandbox app, production = live app.
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      environment: ${PAYPAL_ENVIRONMENT:test}
    # Optional. Enabled when a private key is set. methods: bank_transfer (SPEI, default), cash, card.
    conekta:
      private-key: ${CONEKTA_PRIVATE_KEY:}
      webhook-public-key: ${CONEKTA_WEBHOOK_PUBLIC_KEY:}
      environment: ${CONEKTA_ENVIRONMENT:test}
      methods: ${CONEKTA_METHODS:bank_transfer}

  marketing:
    tiktok:
      enabled: ${TIKTOK_TRACKING_ENABLED:false}
      pixel-id: ${TIKTOK_PIXEL_ID:}
      access-token: ${TIKTOK_EVENTS_API_ACCESS_TOKEN:}
      url: ${TIKTOK_EVENTS_API_URL:https://business-api.tiktok.com/open_api/v1.3/event/track/}
      test-code: ${TIKTOK_TEST_EVENT_CODE:}
