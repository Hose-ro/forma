spring:
  application:
    name: velora-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/velora}
    username: ${DATABASE_USERNAME:velora}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 128KB
    max-http-form-post-size: 128KB
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: VELORA_SESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
        path: /

springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:false}
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'

app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:3000}
  session-secret: ${APP_SESSION_SECRET:}
  cookie-secure: ${APP_COOKIE_SECURE:true}
  currency: MXN
  checkout:
    quote-ttl: 30m
    shipping-flat: 0
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

  payments:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    environment: ${MERCADOPAGO_ENVIRONMENT:test}
    collector-id: ${MERCADOPAGO_COLLECTOR_ID:}
    frontend-url: ${APP_PUBLIC_FRONTEND_URL:}
    backend-url: ${APP_PUBLIC_BACKEND_URL:}
